<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#2563eb">

<link rel="manifest" href="manifest.json">

<title>BPL Tools</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
}

.container {
    max-width: 950px;
    margin: 20px auto;
    padding: 30px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
}

h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 30px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.menu button {
    min-height: 75px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.menu button:hover {
    background: #1d4ed8;
}

.menu button.active {
    background: #111827;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-title {
    font-size: 23px;
    margin-top: 0;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 12px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
}

textarea {
    resize: vertical;
}

.comment-box {
    min-height: 150px;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #2563eb;
}

.add-row {
    display: flex;
    gap: 7px;
}

.add-row input,
.add-row select {
    flex: 1;
}

.add-button {
    width: 48px;
    min-width: 48px;
    border: none;
    border-radius: 8px;
    background: #374151;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.help {
    font-size: 13px;
    color: #6b7280;
    margin-top: 5px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 28px;
}

button.action {
    border: none;
    border-radius: 8px;
    padding: 13px 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.generate {
    background: #2563eb;
    color: white;
}

.pdf {
    background: #dc2626;
    color: white;
}

.copy {
    background: #16a34a;
    color: white;
}

.clear {
    background: #6b7280;
    color: white;
}

.result {
    margin-top: 25px;
    padding: 18px;
    background: #f3f4f6;
    border-radius: 10px;
}

.result textarea {
    font-weight: bold;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.status {
    text-align: center;
    min-height: 24px;
    margin-top: 12px;
    font-weight: bold;
    color: #16a34a;
}

.offline-box {
    margin-top: 25px;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    background: #ecfdf5;
    color: #166534;
    font-size: 14px;
}

/* START / END TABLE */

.endpoint-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

.endpoint-table th,
.endpoint-table td {
    border: 1px solid #d1d5db;
    padding: 9px;
    vertical-align: top;
}

.endpoint-table th {
    background: #f3f4f6;
    font-size: 18px;
}

.endpoint-table td:first-child {
    width: 50%;
}

.endpoint-table td:nth-child(2) {
    width: 50%;
}

.endpoint-table input {
    width: 100%;
}

/* MOBILE */

@media (max-width: 700px) {

    body {
        padding: 0;
    }

    .container {
        width: 100%;
        margin: 0;
        padding: 18px 14px;
        border-radius: 0;
        box-shadow: none;
    }

    .menu {
        grid-template-columns: 1fr;
    }

    .menu button {
        min-height: 60px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .endpoint-table {
        display: block;
    }

    .endpoint-table thead {
        display: block;
    }

    .endpoint-table tbody {
        display: block;
    }

    .endpoint-table tr {
        display: block;
        margin-bottom: 18px;
    }

    .endpoint-table th {
        display: block;
        width: 100% !important;
    }

    .endpoint-table td {
        display: block;
        width: 100% !important;
        border-bottom: none;
    }

    .endpoint-table td:last-child {
        border-bottom: 1px solid #d1d5db;
    }

    .buttons button {
        width: 100%;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>BPL Tools</h1>

<div class="subtitle">
    BPL Testing Tools
</div>


<!-- =====================================================
     MAIN MENU
     ===================================================== -->

<div class="menu">

<button
    id="menuName"
    onclick="showSection('nameSection', this)">
    Generate File Name
</button>

<button
    id="menuVLF"
    onclick="showSection('vlfSection', this)">
    VLF Test
</button>

<button
    id="menuIR"
    onclick="showSection('irSection', this)">
    IR Test
</button>

</div>


<!-- =====================================================
     GENERATE FILE NAME
     ===================================================== -->

<div
    id="nameSection"
    class="section active">

<h2 class="section-title">
    Generate File Name
</h2>

<div class="form-grid">


<div class="field">

<label>Empresa</label>

<div class="add-row">

<select id="empresa">
<option value="">Seleccione una empresa...</option>
</select>

<button
    type="button"
    class="add-button"
    onclick="agregarEmpresa()">
    +
</button>

</div>

</div>


<div class="field">

<label>Tipo de Prueba</label>

<div class="add-row">

<select id="tipoPrueba">
<option value="">Seleccione un tipo...</option>
</select>

<button
    type="button"
    class="add-button"
    onclick="agregarTipoPrueba()">
    +
</button>

</div>

</div>


<div class="field full">

<label>Cliente</label>

<div class="add-row">

<input
    type="text"
    id="cliente"
    list="listaClientes"
    placeholder="Escriba el cliente..."
    autocomplete="off">

<datalist id="listaClientes"></datalist>

<button
    type="button"
    class="add-button"
    onclick="agregarCliente()">
    +
</button>

</div>

</div>


<div class="field">

<label>Locación</label>

<input
    type="text"
    id="locacion"
    placeholder="Escriba la locación...">

</div>


<div class="field">

<label>Lugar Exacto</label>

<input
    type="text"
    id="lugar"
    placeholder="Escriba el lugar exacto...">

</div>


<div class="field">

<label>Elemento Probado</label>

<input
    type="text"
    id="elemento"
    placeholder="Ejemplo: 3x CABLE SET">

</div>


<div class="field">

<label>Fecha</label>

<input
    type="date"
    id="fechaNombre">

</div>


</div>


<div class="buttons">

<button
    class="action generate"
    onclick="generarNombre()">
    Generar Nombre
</button>

<button
    class="action copy"
    onclick="copiarNombre()">
    Copiar
</button>

<button
    class="action clear"
    onclick="limpiarNombre()">
    Limpiar
</button>

</div>


<div class="result">

<label>Nombre generado:</label>

<textarea
    id="resultado"
    rows="4"
    readonly
    placeholder="El nombre aparecerá aquí..."></textarea>

</div>

</div>


<!-- =====================================================
     VLF TEST
     ===================================================== -->

<div
    id="vlfSection"
    class="section">

<h2 class="section-title">
    VLF Test
</h2>


<div class="form-grid">


<div class="field">

    id="vlfNumber"

    step="1"
    placeholder="001">

<div class="help">
    Escriba 1 y se convertirá en 001.
</div>

</div>


<div class="field">

<label>Temperature</label>

<input
    type="text"
    id="vlfTemperature"
    placeholder="Ejemplo: 75 °F">

</div>


<div class="field full">

<label>Comment</label>

<textarea
    id="vlfComment"

</div>


<div class="field">

<label>Fecha</label>

<input
    type="date"
    id="vlfDate">

</div>


<div class="field">

<label>Hora</label>

<input
    type="time"
    id="vlfTime">

</div>


<div class="field">

<label>Number</label>

<input
    type="text"
    id="vlfNumberField">

</div>


<div class="field">

<label>Insulation</label>

<input

</div>


<div class="field full">

<label>Description</label>

<textarea

</div>


<div class="field">

<label>Installation Date</label>

<input
    type="date"
    id="vlfInstallationDate">

</div>


<div class="field">

<label>Voltage Nominal</label>

<input
    type="text"
    id="vlfVoltageNominal"

</div>


<div class="field">

<label>Length</label>

<input
    type="text"
    id="vlfLength"

</div>


<h3>Start / End</h3>


<table class="endpoint-table">

<thead>

<tr>
<th>START</th>
<th>END</th>
</tr>

</thead>

<tbody>


<tr>

<td>
<label>Name</label>
<input type="text" id="vlfStartName">
</td>

<td>
<label>Name</label>
<input type="text" id="vlfEndName">
</td>

</tr>


<tr>

<td>
<label>Number</label>
<input type="text" id="vlfStartNumber">
</td>

<td>
<label>Number</label>
<input type="text" id="vlfEndNumber">
</td>

</tr>


<tr>

<td>
<label>Location</label>
<input type="text" id="vlfStartLocation">
</td>

<td>
<label>Location</label>
<input type="text" id="vlfEndLocation">
</td>

</tr>


<tr>

<td>
<label>Termination</label>
<input type="text" id="vlfStartTermination">
</td>

<td>
<label>Termination</label>
<input type="text" id="vlfEndTermination">
</td>

</tr>


<tr>

<td>
<label>Switchgear</label>
<input type="text" id="vlfStartSwitchgear">
</td>

<td>
<label>Switchgear</label>
<input type="text" id="vlfEndSwitchgear">
</td>

</tr>


<tr>

<td>
<label>Manufacturer</label>
<input type="text" id="vlfStartManufacturer">
</td>

<td>
<label>Manufacturer</label>
<input type="text" id="vlfEndManufacturer">
</td>

</tr>


</tbody>

</table>


<div class="buttons">

<button
    class="action pdf"
    onclick="generarVlfPdf()">
    Generate VLF PDF
</button>

<button
    class="action clear"
    onclick="limpiarVLF()">
    Clear VLF
</button>

</div>


<div
    id="vlfStatus"
    class="status">
</div>

</div>


<!-- =====================================================
     IR TEST
     ===================================================== -->

<div
    id="irSection"
    class="section">

<h2 class="section-title">
    IR Test
</h2>


<div class="form-grid">


<div class="field">

<label>Date</label>

<input
    type="date"
    id="irDate">

</div>


<div class="field">

<label>Time</label>

<input
    type="time"
    id="irTime">

</div>


<div class="field full">

<label>Location</label>

<input
    type="text"
    id="irLocation"
    placeholder="Location">

</div>


<div class="field">

<label>Name</label>

<input
    type="text"
    id="irName">

</div>


<div class="field">

<label>Number</label>

<input
    type="text"
    id="irNumber"
    placeholder="001 o A1">

</div>


<div class="field">

<label>Megger ID</label>

<input
    type="text"
    id="irMeggerId">

</div>


<div class="field">

<label>Type</label>

<select
    id="irType"
    onchange="mostrarOtroIR()">

<option value="">
    Select Type...
</option>

<option>
    Phase A - Ground
</option>

<option>
    Phase B - Ground
</option>

<option>
    Phase C - Ground
</option>

<option>
    Phase A - Phase B
</option>

<option>
    Phase A - Phase C
</option>

<option>
    Phase B - Phase C
</option>

<option>
    Other
</option>

</select>

</div>


<div
    class="field"
    id="irOtherContainer"
    style="display:none">

<label>Other</label>

<input
    type="text"
    id="irOther"
    placeholder="Write the type">

</div>


<div class="field">

<label>Temperature</label>

<input
    type="text"
    id="irTemperature"
    placeholder="Example: 75 °F">

</div>


<div class="field">

<label>Humidity</label>

<input
    type="number"
    id="irHumidity"
    min="0"
    max="100"
    step="0.1"
    placeholder="Ejemplo: 45">

</div>


</div>


<div class="buttons">

<button
    class="action pdf"
    onclick="generarIrPdf()">
    Generate IR PDF
</button>

<button
    class="action clear"
    onclick="limpiarIR()">
    Clear IR
</button>

</div>


<div
    id="irStatus"
    class="status">
</div>

</div>


<div class="offline-box">

✓ BPL Tools — preparado para funcionar sin conexión.

</div>

</div>


<script>

/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_EMPRESAS = "bpl_empresas";
const STORAGE_PRUEBAS = "bpl_pruebas";
const STORAGE_CLIENTES = "bpl_clientes";


let empresas =
    cargarDatos(
        STORAGE_EMPRESAS,
        ["BPL-S"]
    );


let tiposPrueba =
    cargarDatos(
        STORAGE_PRUEBAS,
        ["VLF_TEST"]
    );


let clientes =
    cargarDatos(
        STORAGE_CLIENTES,
        []
    );


function cargarDatos(
    nombre,
    inicial
) {

    const datos =
        localStorage.getItem(nombre);

    if (!datos) {
        return inicial;
    }

    try {
        return JSON.parse(datos);
    }

    catch (e) {
        return inicial;
    }
}


function guardarDatos(
    nombre,
    datos
) {

    localStorage.setItem(
        nombre,
        JSON.stringify(datos)
    );

}


/* =========================================================
   MENU
   ========================================================= */

function showSection(
    sectionId,
    button
) {

    document
        .querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });


    document
        .querySelectorAll(".menu button")
        .forEach(btn => {
            btn.classList.remove("active");
        });


    document
        .getElementById(sectionId)
        .classList.add("active");


    button.classList.add("active");


    if (sectionId === "vlfSection") {
        establecerFechaHoraVLF();
    }


    if (sectionId === "irSection") {
        establecerFechaHoraIR();
    }

}


/* =========================================================
   EMPRESAS
   ========================================================= */

function cargarEmpresas() {

    const select =
        document.getElementById("empresa");

    select.innerHTML =
        '<option value="">Seleccione una empresa...</option>';


    empresas.forEach(
        empresa => {

            const option =
                document.createElement("option");

            option.value = empresa;
            option.textContent = empresa;

            select.appendChild(option);

        }
    );

}


function agregarEmpresa() {

    const nombre =
        prompt(
            "Escriba el nombre de la nueva empresa:"
        );

    if (!nombre) return;

    const empresa =
        nombre.trim().toUpperCase();

    if (!empresa) return;

    if (empresas.includes(empresa)) {

        alert("Esa empresa ya existe.");

        return;
    }

    empresas.push(empresa);

    guardarDatos(
        STORAGE_EMPRESAS,
        empresas
    );

    cargarEmpresas();

    document.getElementById(
        "empresa"
    ).value = empresa;

}


/* =========================================================
   TIPOS DE PRUEBA
   ========================================================= */

function cargarTiposPrueba() {

    const select =
        document.getElementById("tipoPrueba");

    select.innerHTML =
        '<option value="">Seleccione un tipo...</option>';


    tiposPrueba.forEach(
        tipo => {

            const option =
                document.createElement("option");

            option.value = tipo;
            option.textContent = tipo;

            select.appendChild(option);

        }
    );

}


function agregarTipoPrueba() {

    const nombre =
        prompt(
            "Escriba el nuevo tipo de prueba:"
        );

    if (!nombre) return;

    const tipo =
        nombre.trim().toUpperCase();

    if (!tipo) return;

    if (tiposPrueba.includes(tipo)) {

        alert(
            "Ese tipo de prueba ya existe."
        );

        return;
    }

    tiposPrueba.push(tipo);

    guardarDatos(
        STORAGE_PRUEBAS,
        tiposPrueba
    );

    cargarTiposPrueba();

    document.getElementById(
        "tipoPrueba"
    ).value = tipo;

}


/* =========================================================
   CLIENTES
   ========================================================= */

function cargarClientes() {

    const lista =
        document.getElementById(
            "listaClientes"
        );

    lista.innerHTML = "";

    clientes
        .sort()
        .forEach(
            cliente => {

                const option =
                    document.createElement("option");

                option.value = cliente;

                lista.appendChild(option);

            }
        );

}


function agregarCliente() {

    const input =
        document.getElementById("cliente");

    const cliente =
        input.value.trim().toUpperCase();

    if (!cliente) {

        alert(
            "Escriba el nombre del cliente primero."
        );

        return;
    }

    if (clientes.includes(cliente)) {

        alert(
            "Ese cliente ya existe."
        );

        return;
    }

    clientes.push(cliente);

    guardarDatos(
        STORAGE_CLIENTES,
        clientes
    );

    cargarClientes();

    input.value = cliente;

}


/* =========================================================
   GENERADOR DE NOMBRE
   ========================================================= */

function generarNombre() {

    const empresa =
        document.getElementById(
            "empresa"
        ).value.trim().toUpperCase();


    const tipo =
        document.getElementById(
            "tipoPrueba"
        ).value.trim().toUpperCase();


    const cliente =
        document.getElementById(
            "cliente"
        ).value.trim().toUpperCase();


    const locacion =
        document.getElementById(
            "locacion"
        ).value.trim().toUpperCase();


    const lugar =
        document.getElementById(
            "lugar"
        ).value.trim().toUpperCase();


    const elemento =
        document.getElementById(
            "elemento"
        ).value.trim().toUpperCase();


    const fecha =
        document.getElementById(
            "fechaNombre"
        ).value;


    if (
        !empresa ||
        !tipo ||
        !cliente ||
        !locacion ||
        !lugar ||
        !elemento ||
        !fecha
    ) {

        alert(
            "Complete todos los campos."
        );

        return;
    }


    const partes =
        fecha.split("-");


    const fechaFinal =
        partes[1] +
        partes[2] +
        partes[0];


    const elementoFinal =
        elemento.replace(
            /\s+/g,
            "_"
        );


    const resultado =
        empresa +
        "_" +
        tipo +
        "_" +
        cliente +
        "_" +
        locacion +
        "_" +
        lugar +
        "_" +
        elementoFinal +
        "_" +
        fechaFinal;


    document.getElementById(
        "resultado"
    ).value = resultado;

}


async function copiarNombre() {

    const texto =
        document.getElementById(
            "resultado"
        ).value;


    if (!texto) {

        alert(
            "Primero genere el nombre."
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            texto
        );

        alert("Nombre copiado.");

    }

    catch (e) {

        const campo =
            document.getElementById(
                "resultado"
            );

        campo.focus();

        campo.select();

        document.execCommand("copy");

        alert("Nombre copiado.");

    }

}


function limpiarNombre() {

    document.getElementById("empresa").value = "";

    document.getElementById("tipoPrueba").value = "";

    document.getElementById("cliente").value = "";

    document.getElementById("locacion").value = "";

    document.getElementById("lugar").value = "";

    document.getElementById("elemento").value = "";

    document.getElementById("fechaNombre").value = "";

    document.getElementById("resultado").value = "";

}


/* =========================================================
   FECHA Y HORA AUTOMATICA
   ========================================================= */

function obtenerFechaLocal() {

    const ahora = new Date();

    const year =
        ahora.getFullYear();

    const month =
        String(
            ahora.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            ahora.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


function obtenerHoraLocal() {

    const ahora = new Date();

    const hour =
        String(
            ahora.getHours()
        ).padStart(2, "0");

    const minute =
        String(
            ahora.getMinutes()
        ).padStart(2, "0");


    return (
        hour +
        ":" +
        minute
    );

}


function establecerFechaHoraVLF() {

    const fecha =
        document.getElementById(
            "vlfDate"
        );


    const hora =
        document.getElementById(
            "vlfTime"
        );


    if (!fecha.value) {
        fecha.value =

/* =========================================================
   NUMERO DE TRES DIGITOS
   ========================================================= */

function numeroTresDigitos(valor) {

    const numero =
        parseInt(
            valor,
            10
        );


    if (
        isNaN(numero) ||
        numero < 1
    ) {

        return "";

    }


    return String(
        numero
    ).padStart(
        3,
        "0"
    );

}

/* =========================================================
   PDF SIMPLE - SIN INTERNET
   ========================================================= */

function valor(id) {

    const elemento =
        document.getElementById(id);


    if (!elemento) {

        return "";

    }


    return elemento.value.trim();

}


function fechaArchivo(fecha) {

    if (!fecha) {

        const ahora =
            new Date();

        fecha =
            ahora
            .toISOString()
            .substring(
                0,
                10
            );

    }


    const partes =
        fecha.split("-");


    if (partes.length !== 3) {

        return fecha;

    }


    return (
        partes[1] +
        "-" +
        partes[2] +
        "-" +
        partes[0]
    );

}


function horaArchivo(hora) {

    if (!hora) {

        hora =
            obtenerHoraLocal();

    }


    return hora.replace(
        ":",
        ""
    );

}


function agregarCampo(
    lines,
    nombre,
    valorCampo
) {

    lines.push(
        nombre +
        ": " +
        valorCampo
    );

}


function agregarTextoLargo(
    lines,
    texto
) {

    if (!texto) {

        lines.push(
            ""
        );

        return;

    }


    const palabras =
        texto.split(/\s+/);


    let linea = "";


    palabras.forEach(
        palabra => {

            if (
                (linea + " " + palabra)
                .trim()
                .length > 85
            ) {

                lines.push(
                    linea.trim()
                );

                linea =
                    palabra;

            }

            else {

                linea =
                    (
                        linea +
                        " " +
                        palabra
                    ).trim();

            }

        }
    );


    if (linea) {

        lines.push(
            linea
        );

    }

}


/* =========================================================
   CREACION DE PDF
   ========================================================= */

function escaparPDF(texto) {

    return String(texto)
        .replace(/\\/g, "\\\\")
        .replace(/\(/g, "\\(")
        .replace(/\)/g, "\\)");
}


function crearPDF(
    lines,
    filename
) {

    const maxLines =
        45;


    const paginas = [];


    for (
        let i = 0;
        i < lines.length;
        i += maxLines
    ) {

        paginas.push(
            lines.slice(
                i,
                i + maxLines
            )
        );

    }


    const objects = [];


    function addObject(
        contenido
    ) {

        objects.push(
            contenido
        );

        return objects.length;

    }


    const catalogId =
        addObject("");


    const pagesId =
        addObject("");


    const pageIds = [];


    paginas.forEach(
        pageLines => {

            const contentLines = [];


            contentLines.push(
                "BT"
            );


            contentLines.push(
                "/F1 10 Tf"
            );


            contentLines.push(
                "50 760 Td"
            );


            pageLines.forEach(
                (line, index) => {

                    if (index > 0) {

                        contentLines.push(
                            "0 -16 Td"
                        );

                    }


                    contentLines.push(
                        "(" +
                        escaparPDF(line) +
                        ") Tj"
                    );

                }
            );


            contentLines.push(
                "ET"
            );


            const stream =
                contentLines.join(
                    "\n"
                );


            const contentId =
                addObject(
                    "<< /Length " +
                    stream.length +
                    " >>\n" +
                    "stream\n" +
                    stream +
                    "\nendstream"
                );


            const pageId =
                addObject(
                    "<< /Type /Page " +
                    "/Parent " +
                    pagesId +
                    " 0 R " +
                    "/MediaBox [0 0 612 792] " +
                    "/Resources << " +
                    "/Font << " +
                    "/F1 " +
                    "FONT_ID 0 R " +
                    ">> " +
                    ">> " +
                    "/Contents " +
                    contentId +
                    " 0 R >>"
                );


            pageIds.push(
                pageId
            );

        }
    );


    const fontId =
        addObject(
            "<< /Type /Font " +
            "/Subtype /Type1 " +
            "/BaseFont /Helvetica >>"
        );


    pageIds.forEach(
        pageId => {

            objects[pageId - 1] =
                objects[pageId - 1]
                .replace(
                    "FONT_ID",
                    String(fontId)
                );

        }
    );


    objects[pagesId - 1] =
        "<< /Type /Pages " +
        "/Kids [" +
        pageIds
            .map(id => id + " 0 R")
            .join(" ") +
        "] " +
        "/Count " +
        pageIds.length +
        " >>";


    objects[catalogId - 1] =
        "<< /Type /Catalog " +
        "/Pages " +
        pagesId +
        " 0 R >>";


    let pdf =
        "%PDF-1.4\n";


    const offsets = [0];


    objects.forEach(
        (object, index) => {

            offsets[index + 1] =
                pdf.length;


            pdf +=
                (
                    (index + 1) +
                    " 0 obj\n" +
                    object +
                    "\nendobj\n"
                );

        }
    );


    const xref =
        pdf.length;


    pdf +=
        "xref\n" +
        "0 " +
        (objects.length + 1) +
        "\n";


    pdf +=
        "0000000000 65535 f \n";


    for (
        let i = 1;
        i < offsets.length;
        i++
    ) {

        pdf +=
            String(
                offsets[i]
            )
            .padStart(
                10,
                "0"
            ) +
            " 00000 n \n";

    }


    pdf +=
        "trailer\n" +
        "<< /Size " +
        (objects.length + 1) +
        " /Root " +
        catalogId +
        " 0 R >>\n" +
        "startxref\n" +
        xref +
        "\n" +
        "%%EOF";


    const blob =
        new Blob(
            [pdf],
            {
                type: "application/pdf"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        5000
    );

}
