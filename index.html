<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#2563eb">

<link rel="manifest" href="manifest.json">

<title>BPL Tools</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
}

.container {
    max-width: 950px;
    margin: 20px auto;
    padding: 30px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
}

h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 30px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.menu button {
    min-height: 75px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.menu button:hover {
    background: #1d4ed8;
}

.menu button.active {
    background: #111827;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-title {
    font-size: 23px;
    margin-top: 0;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 12px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
}

textarea {
    resize: vertical;
}

.comment-box {
    min-height: 150px;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #2563eb;
}

.add-row {
    display: flex;
    gap: 7px;
}

.add-row input,
.add-row select {
    flex: 1;
}

.add-button {
    width: 48px;
    min-width: 48px;
    border: none;
    border-radius: 8px;
    background: #374151;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.help {
    font-size: 13px;
    color: #6b7280;
    margin-top: 5px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 28px;
}

button.action {
    border: none;
    border-radius: 8px;
    padding: 13px 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.generate {
    background: #2563eb;
    color: white;
}

.pdf {
    background: #dc2626;
    color: white;
}

.copy {
    background: #16a34a;
    color: white;
}

.clear {
    background: #6b7280;
    color: white;
}

.result {
    margin-top: 25px;
    padding: 18px;
    background: #f3f4f6;
    border-radius: 10px;
}

.result textarea {
    font-weight: bold;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.status {
    text-align: center;
    min-height: 24px;
    margin-top: 12px;
    font-weight: bold;
    color: #16a34a;
}

.offline-box {
    margin-top: 25px;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    background: #ecfdf5;
    color: #166534;
    font-size: 14px;
}

/* START / END TABLE */

.endpoint-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

.endpoint-table th,
.endpoint-table td {
    border: 1px solid #d1d5db;
    padding: 9px;
    vertical-align: top;
}

.endpoint-table th {
    background: #f3f4f6;
    font-size: 18px;
}

.endpoint-table td:first-child {
    width: 50%;
}

.endpoint-table td:nth-child(2) {
    width: 50%;
}

.endpoint-table input {
    width: 100%;
}

/* MOBILE */

@media (max-width: 700px) {

    body {
        padding: 0;
    }

    .container {
        width: 100%;
        margin: 0;
        padding: 18px 14px;
        border-radius: 0;
        box-shadow: none;
    }

    .menu {
        grid-template-columns: 1fr;
    }

    .menu button {
        min-height: 60px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .endpoint-table {
        display: block;
    }

    .endpoint-table thead {
        display: block;
    }

    .endpoint-table tbody {
        display: block;
    }

    .endpoint-table tr {
        display: block;
        margin-bottom: 18px;
    }

    .endpoint-table th {
        display: block;
        width: 100% !important;
    }

    .endpoint-table td {
        display: block;
        width: 100% !important;
        border-bottom: none;
    }

    .endpoint-table td:last-child {
        border-bottom: 1px solid #d1d5db;
    }

    .buttons button {
        width: 100%;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>BPL Tools</h1>

<div class="subtitle">
    BPL Testing Tools
</div>


<!-- =====================================================
     MAIN MENU
     ===================================================== -->

<div class="menu">

<button
    id="menuName"
    onclick="showSection('nameSection', this)">
    Generate File Name
</button>

<button
    id="menuVLF"
    onclick="showSection('vlfSection', this)">
    VLF Test
</button>

<button
    id="menuIR"
    onclick="showSection('irSection', this)">
    IR Test
</button>

</div>


<!-- =====================================================
     GENERATE FILE NAME
     ===================================================== -->

<div
    id="nameSection"
    class="section active">

<h2 class="section-title">
    Generate File Name
</h2>

<div class="form-grid">


<div class="field">

<label>Empresa</label>

<div class="add-row">

<select id="empresa">
<option value="">Seleccione una empresa...</option>
</select>

<button
    type="button"
    class="add-button"
    onclick="agregarEmpresa()">
    +
</button>

</div>

</div>


<div class="field">

<label>Tipo de Prueba</label>

<div class="add-row">

<select id="tipoPrueba">
<option value="">Seleccione un tipo...</option>
</select>

<button
    type="button"
    class="add-button"
    onclick="agregarTipoPrueba()">
    +
</button>

</div>

</div>


<div class="field full">

<label>Cliente</label>

<div class="add-row">

<input
    type="text"
    id="cliente"
    list="listaClientes"
    placeholder="Escriba el cliente..."
    autocomplete="off">

<datalist id="listaClientes"></datalist>

<button
    type="button"
    class="add-button"
    onclick="agregarCliente()">
    +
</button>

</div>

</div>


<div class="field">

<label>Locación</label>

<input
    type="text"
    id="locacion"
    placeholder="Escriba la locación...">

</div>


<div class="field">

<label>Lugar Exacto</label>

<input
    type="text"
    id="lugar"
    placeholder="Escriba el lugar exacto...">

</div>


<div class="field">

<label>Elemento Probado</label>

<input
    type="text"
    id="elemento"
    placeholder="Ejemplo: 3x CABLE SET">

</div>


<div class="field">

<label>Fecha</label>

<input
    type="date"
    id="fechaNombre">

</div>


</div>


<div class="buttons">

<button
    class="action generate"
    onclick="generarNombre()">
    Generar Nombre
</button>

<button
    class="action copy"
    onclick="copiarNombre()">
    Copiar
</button>

<button
    class="action clear"
    onclick="limpiarNombre()">
    Limpiar
</button>

</div>


<div class="result">

<label>Nombre generado:</label>

<textarea
    id="resultado"
    rows="4"
    readonly
    placeholder="El nombre aparecerá aquí..."></textarea>

</div>

</div>


<!-- =====================================================
     VLF TEST
     ===================================================== -->

<div
    id="vlfSection"
    class="section">

<h2 class="section-title">
    VLF Test
</h2>


<div class="form-grid">


<div class="field">

<label>VLF #</label>

<input
    type="number"
    id="vlfNumber"
    min="1"
    step="1"
    placeholder="001">

<div class="help">
    Escriba 1 y se convertirá en 001.
</div>

</div>


<div class="field">

<label>Temperature</label>

<input
    type="text"
    id="vlfTemperature"
    placeholder="Ejemplo: 75 °F">

</div>


<div class="field full">

<label>Comment</label>

<textarea
    id="vlfComment"
    class="comment-box"
    placeholder="Escriba aquí cualquier comentario o información adicional..."></textarea>

</div>


<div class="field">

<label>Fecha</label>

<input
    type="date"
    id="vlfDate">

</div>


<div class="field">

<label>Hora</label>

<input
    type="time"
    id="vlfTime">

</div>


<div class="field">

<label>Number</label>

<input
    type="text"
    id="vlfNumberField">

</div>


<div class="field">

<label>Insulation</label>

<input
    type="text"
    id="vlfInsulation">

</div>


<div class="field full">

<label>Description</label>

<textarea
    id="vlfDescription"
    rows="3"></textarea>

</div>


<div class="field">

<label>Installation Date</label>

<input
    type="date"
    id="vlfInstallationDate">

</div>


<div class="field">

<label>Voltage Nominal</label>

<input
    type="text"
    id="vlfVoltageNominal"
    placeholder="Ejemplo: 15 kV">

</div>


<div class="field">

<label>Length</label>

<input
    type="text"
    id="vlfLength"
    placeholder="Ejemplo: 500 ft">

</div>

</div>


<h3>Start / End</h3>


<table class="endpoint-table">

<thead>

<tr>
<th>START</th>
<th>END</th>
</tr>

</thead>

<tbody>


<tr>

<td>
<label>Name</label>
<input type="text" id="vlfStartName">
</td>

<td>
<label>Name</label>
<input type="text" id="vlfEndName">
</td>

</tr>


<tr>

<td>
<label>Number</label>
<input type="text" id="vlfStartNumber">
</td>

<td>
<label>Number</label>
<input type="text" id="vlfEndNumber">
</td>

</tr>


<tr>

<td>
<label>Location</label>
<input type="text" id="vlfStartLocation">
</td>

<td>
<label>Location</label>
<input type="text" id="vlfEndLocation">
</td>

</tr>


<tr>

<td>
<label>Termination</label>
<input type="text" id="vlfStartTermination">
</td>

<td>
<label>Termination</label>
<input type="text" id="vlfEndTermination">
</td>

</tr>


<tr>

<td>
<label>Switchgear</label>
<input type="text" id="vlfStartSwitchgear">
</td>

<td>
<label>Switchgear</label>
<input type="text" id="vlfEndSwitchgear">
</td>

</tr>


<tr>

<td>
<label>Manufacturer</label>
<input type="text" id="vlfStartManufacturer">
</td>

<td>
<label>Manufacturer</label>
<input type="text" id="vlfEndManufacturer">
</td>

</tr>


</tbody>

</table>


<div class="buttons">

<button
    class="action pdf"
    onclick="generarVlfPdf()">
    Generate VLF PDF
</button>

<button
    class="action clear"
    onclick="limpiarVLF()">
    Clear VLF
</button>

</div>


<div
    id="vlfStatus"
    class="status">
</div>

</div>


<!-- =====================================================
     IR TEST
     ===================================================== -->

<div
    id="irSection"
    class="section">

<h2 class="section-title">
    IR Test
</h2>


<div class="form-grid">


<div class="field">

<label>Date</label>

<input
    type="date"
    id="irDate" readonly tabindex="-1">

</div>


<div class="field">

<label>Time</label>

<input
    type="time"
    id="irTime" readonly tabindex="-1">

</div>


<div class="field full">

<label>Location</label>

<input
    type="text"
    id="irLocation"
    placeholder="Location">

</div>


<div class="field">

<label>Name</label>

<input
    type="text"

</div>


<div class="field">

<label>Number</label>

<input
    type="text"
    id="irNumber"

</div>


<div class="field">

<label>Megger ID</label>

<div class="field">

</div>


<div class="field">

<label>Type</label>

<select
    id="irType"
    onchange="mostrarOtroIR()">

<option value="">
    Select Type...
</option>

<option>
    Phase A - Ground
</option>

<option>
    Phase B - Ground
</option>

<option>
    Phase C - Ground
</option>

<option>
    Phase A - Phase B
</option>

<option>
    Phase A - Phase C
</option>

<option>
    Phase B - Phase C
</option>

<option>
    Phase A2 - Ground
</option>

<option>
    Phase B2 - Ground
</option>

<option>
    Phase C2 - Ground
</option>

<option>
    Phase A2 - Phase B2
</option>

<option>
    Phase A2 - Phase C2
</option>

<option>
    Phase B2 - Phase C2
</option>

<option>
    Other
</option>

</select>

</div>


<div
    class="field"
    id="irOtherContainer"
    style="display:none">

<label>Other</label>

<input
    type="text"
    id="irOther"
    placeholder="Write the type">

</div>


<div class="field">
<label>Ambient Temperature (°F)</label>
<input type="number" id="irTemperature" step="any" placeholder="Example: 75">
</div>

<div class="field">
<label>Equipment Surface Temperature (°C)</label>
<input type="number" id="irSurfaceTemperature" step="any" placeholder="Example: 32.5">
</div>


<div class="field">

<label>Humidity</label>

<input
    type="number"
    id="irHumidity"
    min="0"
    max="100"
    step="0.1"
    placeholder="Ejemplo: 45">

</div>


<div class="field full">
<label>Comments (optional)</label>
<textarea id="irComment" class="comment-box" placeholder="Observaciones de la prueba..." rows="4"></textarea>
</div>

<div class="field full">
<label>Equipment Photo (optional)</label>
<input id="irPhoto" type="file" accept="image/*" onchange="mostrarFotoIR()">
<div class="help">Puedes elegir una fotografía o tomarla con la cámara del iPhone. La foto se incorpora al PDF.</div>
<img id="irPhotoPreview" alt="Vista previa" style="display:none;max-width:100%;max-height:260px;object-fit:contain;margin-top:10px;border-radius:10px">
</div>

</div>

<div class="buttons">

<button
    class="action pdf"
    onclick="generarIrPdf()">
    Generate IR PDF
</button>

<button
    class="action clear"
    onclick="limpiarIR()">
    Clear IR
</button>

</div>


<div
    id="irStatus"
    class="status">
</div>

</div>


<div class="offline-box">

✓ BPL Tools — preparado para funcionar sin conexión.

</div>

</div>


<script>

/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_EMPRESAS = "bpl_empresas";
const STORAGE_PRUEBAS = "bpl_pruebas";
const STORAGE_CLIENTES = "bpl_clientes";


let empresas =
    cargarDatos(
        STORAGE_EMPRESAS,
        ["BPL-S"]
    );


let tiposPrueba =
    cargarDatos(
        STORAGE_PRUEBAS,
        ["VLF_TEST"]
    );


let clientes =
    cargarDatos(
        STORAGE_CLIENTES,
        []
    );


function cargarDatos(
    nombre,
    inicial
) {

    const datos =
        localStorage.getItem(nombre);

    if (!datos) {
        return inicial;
    }

    try {
        return JSON.parse(datos);
    }

    catch (e) {
        return inicial;
    }
}


function guardarDatos(
    nombre,
    datos
) {

    localStorage.setItem(
        nombre,
        JSON.stringify(datos)
    );

}


/* =========================================================
   MENU
   ========================================================= */

function showSection(
    sectionId,
    button
) {

    document
        .querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });


    document
        .querySelectorAll(".menu button")
        .forEach(btn => {
            btn.classList.remove("active");
        });


    document
        .getElementById(sectionId)
        .classList.add("active");


    button.classList.add("active");


    if (sectionId === "vlfSection") {
        establecerFechaHoraVLF();
    }


    if (sectionId === "irSection") {
        establecerFechaHoraIR();
    }

}


/* =========================================================
   EMPRESAS
   ========================================================= */

function cargarEmpresas() {

    const select =
        document.getElementById("empresa");

    select.innerHTML =
        '<option value="">Seleccione una empresa...</option>';


    empresas.forEach(
        empresa => {

            const option =
                document.createElement("option");

            option.value = empresa;
            option.textContent = empresa;

            select.appendChild(option);

        }
    );

}


function agregarEmpresa() {

    const nombre =
        prompt(
            "Escriba el nombre de la nueva empresa:"
        );

    if (!nombre) return;

    const empresa =
        nombre.trim().toUpperCase();

    if (!empresa) return;

    if (empresas.includes(empresa)) {

        alert("Esa empresa ya existe.");

        return;
    }

    empresas.push(empresa);

    guardarDatos(
        STORAGE_EMPRESAS,
        empresas
    );

    cargarEmpresas();

    document.getElementById(
        "empresa"
    ).value = empresa;

}


/* =========================================================
   TIPOS DE PRUEBA
   ========================================================= */

function cargarTiposPrueba() {

    const select =
        document.getElementById("tipoPrueba");

    select.innerHTML =
        '<option value="">Seleccione un tipo...</option>';


    tiposPrueba.forEach(
        tipo => {

            const option =
                document.createElement("option");

            option.value = tipo;
            option.textContent = tipo;

            select.appendChild(option);

        }
    );

}


function agregarTipoPrueba() {

    const nombre =
        prompt(
            "Escriba el nuevo tipo de prueba:"
        );

    if (!nombre) return;

    const tipo =
        nombre.trim().toUpperCase();

    if (!tipo) return;

    if (tiposPrueba.includes(tipo)) {

        alert(
            "Ese tipo de prueba ya existe."
        );

        return;
    }

    tiposPrueba.push(tipo);

    guardarDatos(
        STORAGE_PRUEBAS,
        tiposPrueba
    );

    cargarTiposPrueba();

    document.getElementById(
        "tipoPrueba"
    ).value = tipo;

}


/* =========================================================
   CLIENTES
   ========================================================= */

function cargarClientes() {

    const lista =
        document.getElementById(
            "listaClientes"
        );

    lista.innerHTML = "";

    clientes
        .sort()
        .forEach(
            cliente => {

                const option =
                    document.createElement("option");

                option.value = cliente;

                lista.appendChild(option);

            }
        );

}


function agregarCliente() {

    const input =
        document.getElementById("cliente");

    const cliente =
        input.value.trim().toUpperCase();

    if (!cliente) {

        alert(
            "Escriba el nombre del cliente primero."
        );

        return;
    }

    if (clientes.includes(cliente)) {

        alert(
            "Ese cliente ya existe."
        );

        return;
    }

    clientes.push(cliente);

    guardarDatos(
        STORAGE_CLIENTES,
        clientes
    );

    cargarClientes();

    input.value = cliente;

}


/* =========================================================
   GENERADOR DE NOMBRE
   ========================================================= */

function generarNombre() {

    const empresa =
        document.getElementById(
            "empresa"
        ).value.trim().toUpperCase();


    const tipo =
        document.getElementById(
            "tipoPrueba"
        ).value.trim().toUpperCase();


    const cliente =
        document.getElementById(
            "cliente"
        ).value.trim().toUpperCase();


    const locacion =
        document.getElementById(
            "locacion"
        ).value.trim().toUpperCase();


    const lugar =
        document.getElementById(
            "lugar"
        ).value.trim().toUpperCase();


    const elemento =
        document.getElementById(
            "elemento"
        ).value.trim().toUpperCase();


    const fecha =
        document.getElementById(
            "fechaNombre"
        ).value;


    if (
        !empresa ||
        !tipo ||
        !cliente ||
        !locacion ||
        !lugar ||
        !elemento ||
        !fecha
    ) {

        alert(
            "Complete todos los campos."
        );

        return;
    }


    const partes =
        fecha.split("-");


    const fechaFinal =
        partes[1] +
        partes[2] +
        partes[0];


    const elementoFinal =
        elemento.replace(
            /\s+/g,
            "_"
        );


    const resultado =
        empresa +
        "_" +
        tipo +
        "_" +
        cliente +
        "_" +
        locacion +
        "_" +
        lugar +
        "_" +
        elementoFinal +
        "_" +
        fechaFinal;


    document.getElementById(
        "resultado"
    ).value = resultado;

}


async function copiarNombre() {

    const texto =
        document.getElementById(
            "resultado"
        ).value;


    if (!texto) {

        alert(
            "Primero genere el nombre."
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            texto
        );

        alert("Nombre copiado.");

    }

    catch (e) {

        const campo =

    }

}

/* =========================================================
   FECHA Y HORA AUTOMATICA
   ========================================================= */

function obtenerFechaLocal() {

    const ahora = new Date();

    const year =
        ahora.getFullYear();

    const month =
        String(
            ahora.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            ahora.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


function obtenerHoraLocal() {

    const ahora = new Date();

    const hour =
        String(
            ahora.getHours()
        ).padStart(2, "0");

    const minute =
        String(
            ahora.getMinutes()
        ).padStart(2, "0");


    return (
        hour +
        ":" +
        minute
    );

}


function establecerFechaHoraVLF() {

}

/* =========================================================
   NUMERO DE TRES DIGITOS
   ========================================================= */

function numeroTresDigitos(valor) {

    const numero =
        parseInt(
            valor,
            10
        );


    if (
        isNaN(numero) ||
        numero < 1
    ) {

        return "";

    }


    return String(
        numero
    ).padStart(
        3,
        "0"
    );

}


/* =========================================================
   VLF PDF
   ========================================================= */

function generarVlfPdf() {

    establecerFechaHoraVLF();


    const numero =
        numeroTresDigitos(
            document.getElementById(
                "vlfNumber"
            ).value
        );


    if (!numero) {

        alert(
            "Escriba el VLF #."
        );

        return;
    }


    const fecha =
        document.getElementById(
            "vlfDate"
        ).value;


    const hora =
        document.getElementById(
            "vlfTime"
        ).value;


    const temperatura =
        valor("vlfTemperature");


    const comentario =
        valor("vlfComment");


    const numberField =
        valor("vlfNumberField");


    const insulation =
        valor("vlfInsulation");


    const description =
        valor("vlfDescription");


    const installationDate =
        valor("vlfInstallationDate");


    const voltage =
        valor("vlfVoltageNominal");


    const length =
        valor("vlfLength");


    const start = {

        Name:
            valor("vlfStartName"),

        Number:
            valor("vlfStartNumber"),

        Location:
            valor("vlfStartLocation"),

        Termination:
            valor("vlfStartTermination"),

        Switchgear:
            valor("vlfStartSwitchgear"),

        Manufacturer:
            valor("vlfStartManufacturer")

    };


    const end = {

        Name:
            valor("vlfEndName"),

        Number:
            valor("vlfEndNumber"),

        Location:
            valor("vlfEndLocation"),

        Termination:
            valor("vlfEndTermination"),

        Switchgear:
            valor("vlfEndSwitchgear"),

        Manufacturer:
            valor("vlfEndManufacturer")

    };


    const filename =
        "BPL-S_VLF_" +
        numero +
        "_" +
        fechaArchivo(fecha) +
        "_" +
        horaArchivo(hora) +
        ".pdf";


    const lines = [];


    lines.push("BPL-S - VLF TEST");

    lines.push("");

    lines.push(
        "VLF #: " + numero
    );

    lines.push(
        "Date: " + fecha
    );

    lines.push(
        "Time: " + hora
    );

    lines.push(
        "Temperature: " + temperatura
    );

    lines.push(
        "Number: " + numberField
    );

    lines.push(
        "Insulation: " + insulation
    );

    lines.push(
        "Description: " + description
    );

    lines.push(
        "Installation Date: " +
        installationDate
    );

    lines.push(
        "Voltage Nominal: " +
        voltage
    );

    lines.push(
        "Length: " + length
    );

    lines.push("");

    lines.push("COMMENT:");

    agregarTextoLargo(
        lines,
        comentario
    );

    lines.push("");

    lines.push("START");

    agregarCampo(
        lines,
        "Name",
        start.Name
    );

    agregarCampo(
        lines,
        "Number",
        start.Number
    );

    agregarCampo(
        lines,
        "Location",
        start.Location
    );

    agregarCampo(
        lines,
        "Termination",
        start.Termination
    );

    agregarCampo(
        lines,
        "Switchgear",
        start.Switchgear
    );

    agregarCampo(
        lines,
        "Manufacturer",
        start.Manufacturer
    );

    lines.push("");

    lines.push("END");

    agregarCampo(
        lines,
        "Name",
        end.Name
    );

    agregarCampo(
        lines,
        "Number",
        end.Number
    );

    agregarCampo(
        lines,
        "Location",
        end.Location
    );

    agregarCampo(
        lines,
        "Termination",
        end.Termination
    );

    agregarCampo(
        lines,
        "Switchgear",
        end.Switchgear
    );

    agregarCampo(
        lines,
        "Manufacturer",
        end.Manufacturer
    );


    crearPDF(
        lines,
        filename
    );


    document.getElementById(
        "vlfStatus"
    ).textContent =
        "VLF PDF generated: " +
        filename;

}

function mostrarOtroIR() {

    const tipo =
        document.getElementById(
            "irType"
        ).value;


    const container =
        document.getElementById(
            "irOtherContainer"
        );


    if (tipo === "Other") {

        container.style.display =
            "flex";

    }

    else {

        container.style.display =
            "none";

        document.getElementById(
            "irOther"
        ).value = "";

    }

}


function mostrarOtroEquipoIR() {
    const isOther = valor("irTesterEquipment") === "Other";
    document.getElementById("irTesterEquipmentOtherContainer").style.display = isOther ? "flex" : "none";
    if (!isOther) document.getElementById("irTesterEquipmentOther").value = "";
}

function obtenerEquipoIR() {
    return valor("irTesterEquipment") === "Other"
        ? valor("irTesterEquipmentOther")
        : valor("irTesterEquipment");
}

function obtenerTipoIR() {

    const tipo =
        valor("irType");


    if (tipo === "Other") {

        return valor("irOther");

    }


    return tipo;

}

function mostrarFotoIR() {
    const input = document.getElementById("irPhoto");
    const preview = document.getElementById("irPhotoPreview");
    if (preview.dataset.objectUrl) URL.revokeObjectURL(preview.dataset.objectUrl);
    if (!input.files || !input.files[0]) { preview.style.display = "none"; preview.removeAttribute("src"); return; }
    const url = URL.createObjectURL(input.files[0]);
    preview.dataset.objectUrl = url;
    preview.src = url;
    preview.style.display = "block";
}

function cargarImagenIR(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("No se pudo abrir la imagen."));
        img.src = src;
    });
}

function crearPdfImagenIR(canvas, filename) {
    const base64 = canvas.toDataURL("image/jpeg", 0.88).split(",")[1];
    const binary = atob(base64);
    const jpeg = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) jpeg[i] = binary.charCodeAt(i);
    // Width 360pt; a narrow page sized to its actual content.
    const w = 360, h = Math.round(canvas.height * w / canvas.width);
    const encoder = new TextEncoder();
    const chunks = [], offsets = [0]; let pos = 0;
    function addBytes(bytes) { chunks.push(bytes); pos += bytes.length; }
    function addText(t) { addBytes(encoder.encode(t)); }
    function object(id, content) { offsets[id] = pos; addText(id + " 0 obj\n" + content + "\nendobj\n"); }
    addText("%PDF-1.4\n");
    object(1, "<< /Type /Catalog /Pages 2 0 R >>");
    object(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
    object(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + w + " " + h + "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
    offsets[4] = pos;
    addText("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + canvas.width + " /Height " + canvas.height + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n");
    addBytes(jpeg);
    addText("\nendstream\nendobj\n");
    const commands = "q\n" + w + " 0 0 " + h + " 0 0 cm\n/Im0 Do\nQ\n";
    object(5, "<< /Length " + encoder.encode(commands).length + " >>\nstream\n" + commands + "endstream");
    const xref = pos;
    addText("xref\n0 6\n0000000000 65535 f \n");
    for (let i = 1; i <= 5; i++) addText(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
    addText("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF");
    const blob = new Blob(chunks, {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function generarIrPdf() {
    const numero = valor("irNumber");
    if (!numero) { alert("Escriba el Number."); return; }
    const button = document.querySelector('#irSection button.pdf');
    button.disabled = true;
    const status = document.getElementById("irStatus");
    status.textContent = "Preparing IR PDF...";
    try {
        // Capture timestamp at the actual moment the Generate button is pressed.
        const now = new Date();
        const pad = n => String(n).padStart(2, "0");
        const fecha = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate());
        const hora = pad(now.getHours()) + ":" + pad(now.getMinutes());
        document.getElementById("irDate").value = fecha;
        document.getElementById("irTime").value = hora;
        const filename = "BPL-S_IR_" + numero.replace(/[\\/:*?"<>|]/g,"-") + "_" + fechaArchivo(fecha) + "_" + horaArchivo(hora) + ".pdf";
        const photoFile = document.getElementById("irPhoto").files[0];
        let photo = null;
        if (photoFile) {
            const photoUrl = URL.createObjectURL(photoFile);
            try { photo = await cargarImagenIR(photoUrl); }
            finally { URL.revokeObjectURL(photoUrl); }
        }
        const logo = await cargarImagenIR(IR_LOGO_DATA);
        const width = 720, margin = 40, inner = width - margin*2;
        // Preflight measure text and determine exact report height.
        const probe = document.createElement("canvas").getContext("2d");
        function wrapped(ctx, text, maxWidth) {
            const result = [];
            for (const paragraph of String(text || "").split(/\r?\n/)) {
                const words = paragraph.split(/\s+/).filter(Boolean);
                if (!words.length) { result.push(""); continue; }
                let line = "";
                for (const word of words) {
                    if (line && ctx.measureText(line + " " + word).width > maxWidth) { result.push(line); line = word; }
                    else line = line ? line + " " + word : word;
                    // Break exceptionally long unspaced text too.
                    while (ctx.measureText(line).width > maxWidth && line.length > 1) {
                        let n = line.length - 1;
                        while (n > 1 && ctx.measureText(line.slice(0,n)).width > maxWidth) n--;
                        result.push(line.slice(0,n)); line = line.slice(n);
                    }
                }
                if (line) result.push(line);
            }
            return result;
        }
        const fields = [
            ["LOCATION",valor("irLocation")], ["NAME",valor("irName")],
            ["NUMBER",numero], ["MEGGER ID",valor("irMeggerId")],
            ["TESTER EQUIPMENT",obtenerEquipoIR()],
            ["TEST TYPE",obtenerTipoIR()],
            ["AMBIENT TEMPERATURE",valor("irTemperature") ? valor("irTemperature") + " °F" : ""],
            ["EQUIPMENT SURFACE TEMPERATURE",valor("irSurfaceTemperature") ? valor("irSurfaceTemperature") + " °C" : ""],
            ["HUMIDITY",valor("irHumidity") ? valor("irHumidity") + " %" : ""]
        ];
        const comments = valor("irComment");
        function render(ctx, drawing) {
            let y = 0;
            const navy = "#16334c", grey = "#5c6c7c";
            function rect(x, yy, w, h, color) { if (drawing) {ctx.fillStyle=color;ctx.fillRect(x,yy,w,h);} }
            function lineText(t,x,yy,font,color) {ctx.font=font; if(drawing){ctx.fillStyle=color;ctx.fillText(t,x,yy);} }
            rect(0,0,width,225,navy);
            if (drawing) { ctx.drawImage(logo,width-225,31,205,137); }
            lineText("IR TEST REPORT",margin,79,"bold 36px Arial","#ffffff");
            lineText("BPL TOOLS  |  ELECTRICAL TEST LOG",margin,114,"19px Arial","#d5e4ed");
            lineText("Date: " + fechaArchivo(fecha),margin,162,"21px Arial","#ffffff");
            lineText("Time: " + hora,margin,194,"21px Arial","#ffffff");
            y=258;
            lineText("EQUIPMENT & TEST INFORMATION",margin,y,"bold 21px Arial",navy); y+=23;
            rect(margin,y,inner,3,"#d8e3ec"); y+=25;
            for (const [label,value] of fields) {
                lineText(label,margin+12,y+18,"bold 17px Arial",grey);
                ctx.font="bold 24px Arial";
                const lines=wrapped(ctx,value || "—",inner-35);
                y+=39;
                for(const l of lines) {lineText(l,margin+12,y+18,"bold 24px Arial","#1c2a37");y+=32;}
                y+=16;
                rect(margin,y,inner,1,"#e2e8ef");y+=20;
            }
            if (photo) {
                y+=14; lineText("EQUIPMENT PHOTO",margin,y,"bold 21px Arial",navy);y+=20;
                const photoHeight=Math.min(470,inner*photo.height/photo.width);
                if (drawing) {ctx.fillStyle="#f0f3f6";ctx.fillRect(margin,y,inner,photoHeight);ctx.drawImage(photo,margin+(inner-inner*photoHeight/(inner*photo.height/photo.width))/2,y,inner*photoHeight/(inner*photo.height/photo.width),photoHeight);}
                y+=photoHeight+34;
            }
            if (comments) {
                lineText("COMMENTS",margin,y,"bold 21px Arial",navy); y+=25;
                ctx.font="23px Arial";
                const lines=wrapped(ctx,comments,inner-32);
                rect(margin,y,inner,Math.max(64,lines.length*34+30),"#f1f5f9");
                y+=29;
                for(const l of lines){lineText(l,margin+16,y,"23px Arial","#1c2a37");y+=34;}
                y+=40;
            }
            y+=22;
            rect(0,y,width,3,"#d8e3ec");y+=38;
            lineText("Crisosto, inc.  •  Personal testing log",margin,y,"18px Arial",grey);y+=38;
            return y;
        }
        const height = Math.ceil(render(probe,false));
        if (height > 12000) throw new Error("El comentario es demasiado largo para un solo PDF. Acórtalo e intenta de nuevo.");
        const canvas=document.createElement("canvas"); canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,width,height);
        render(ctx,true);
        crearPdfImagenIR(canvas,filename);
        status.textContent="IR PDF generated: " + filename;
    } catch(e) { console.error(e);status.textContent="";alert("No se pudo generar el PDF: " + e.message); }
    finally { button.disabled=false; }
}

   PDF SIMPLE - SIN INTERNET
   ========================================================= */

function valor(id) {

    const elemento =
        document.getElementById(id);


    if (!elemento) {

        return "";

    }


    return elemento.value.trim();

}


function fechaArchivo(fecha) {

    if (!fecha) {

        const ahora =
            new Date();

        fecha =
            ahora
            .toISOString()
            .substring(
                0,
                10
            );

    }


    const partes =
        fecha.split("-");


    if (partes.length !== 3) {

        return fecha;

    }


    return (
        partes[1] +
        "-" +
        partes[2] +
        "-" +
        partes[0]
    );

}


function horaArchivo(hora) {

    if (!hora) {

        hora =
            obtenerHoraLocal();

    }


    return hora.replace(
        ":",
        ""
    );

}


function agregarCampo(
    lines,
    nombre,
    valorCampo
) {

    lines.push(
        nombre +
        ": " +
        valorCampo
    );

}


function agregarTextoLargo(
    lines,
    texto
) {

    if (!texto) {

        lines.push(
            ""
        );

        return;

    }


    const palabras =
        texto.split(/\s+/);


    let linea = "";


    palabras.forEach(
        palabra => {

            if (
                (linea + " " + palabra)
                .trim()
                .length > 85
            ) {

                lines.push(
                    linea.trim()
                );

                linea =
                    palabra;

            }

            else {

                linea =
                    (
                        linea +
                        " " +
                        palabra
                    ).trim();

            }

        }
    );


    if (linea) {

        lines.push(
            linea
        );

    }

}

function escaparPDF(texto) {

    return String(texto)
        .replace(/\\/g, "\\\\")
        .replace(/\(/g, "\\(")
        .replace(/\)/g, "\\)");
}


function crearPDF(
    lines,
    filename
) {

    const maxLines =
        45;


    const paginas = [];


    for (
        let i = 0;
        i < lines.length;
        i += maxLines
    ) {

        paginas.push(
            lines.slice(
                i,
                i + maxLines
            )
        );

    }


    const objects = [];


    function addObject(
        contenido
    ) {

        objects.push(
            contenido
        );

        return objects.length;

    }


    const catalogId =
        addObject("");


    const pagesId =
        addObject("");


    const pageIds = [];


    paginas.forEach(
        pageLines => {

            const contentLines = [];


            contentLines.push(
                "BT"
            );


            contentLines.push(
                "/F1 10 Tf"
            );


            contentLines.push(
                "50 760 Td"
            );


            pageLines.forEach(
                (line, index) => {

                    if (index > 0) {

                        contentLines.push(
                            "0 -16 Td"
                        );

                    }


                    contentLines.push(
                        "(" +
                        escaparPDF(line) +
                        ") Tj"
                    );

                }
            );


            contentLines.push(
                "ET"
            );


            const stream =
                contentLines.join(
                    "\n"
                );


            const contentId =
                addObject(
                    "<< /Length " +
                    stream.length +
                    " >>\n" +
                    "stream\n" +
                    stream +
                    "\nendstream"
                );


            const pageId =
                addObject(
                    "<< /Type /Page " +
                    "/Parent " +
                    pagesId +
                    " 0 R " +
                    "/MediaBox [0 0 612 792] " +
                    "/Resources << " +
                    "/Font << " +
                    "/F1 " +
                    "FONT_ID 0 R " +
                    ">> " +
                    ">> " +
                    "/Contents " +
                    contentId +
                    " 0 R >>"
                );


            pageIds.push(
                pageId
            );

        }
    );


    const fontId =
        addObject(
            "<< /Type /Font " +
            "/Subtype /Type1 " +
            "/BaseFont /Helvetica >>"
        );


    pageIds.forEach(
        pageId => {

            objects[pageId - 1] =
                objects[pageId - 1]
                .replace(
                    "FONT_ID",
                    String(fontId)
                );

        }
    );


    objects[pagesId - 1] =
        "<< /Type /Pages " +
        "/Kids [" +
        pageIds
            .map(id => id + " 0 R")
            .join(" ") +
        "] " +
        "/Count " +
        pageIds.length +
        " >>";


    objects[catalogId - 1] =
        "<< /Type /Catalog " +
        "/Pages " +
        pagesId +
        " 0 R >>";


    let pdf =
        "%PDF-1.4\n";


    const offsets = [0];


    objects.forEach(
        (object, index) => {

            offsets[index + 1] =
                pdf.length;


            pdf +=
                (
                    (index + 1) +
                    " 0 obj\n" +
                    object +
                    "\nendobj\n"
                );

        }
    );


    const xref =
        pdf.length;


    pdf +=
        "xref\n" +
        "0 " +
        (objects.length + 1) +
        "\n";


    pdf +=
        "0000000000 65535 f \n";


    for (
        let i = 1;
        i < offsets.length;
        i++
    ) {

        pdf +=
            String(
                offsets[i]
            )
            .padStart(
                10,
                "0"
            ) +
            " 00000 n \n";

    }


    pdf +=
        "trailer\n" +
        "<< /Size " +
        (objects.length + 1) +
        " /Root " +
        catalogId +
        " 0 R >>\n" +
        "startxref\n" +
        xref +
        "\n" +
        "%%EOF";


    const blob =
        new Blob(
            [pdf],
            {
                type: "application/pdf"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        5000
    );

}
